<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FourSight</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">FourSight</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="index.html">Game</a>
                <a class="nav-link" href="about_us.html">About Us</a>
                <a class="nav-link" href="contact_us.html">Contact Us</a>
            </div>
        </div>
    </nav>
    <div class="container text-center mt-5">
        
        <h1 class="mb-4 fw-bold text-uppercase" style="letter-spacing: 2px; color: #017f8d;">Guess the Word!</h1>

        <div class="game-box p-4 mx-auto">
            <h2 id="level-title">Level 1</h2>
            
            <div id="image-grid" class="row mt-4 mb-3"></div>
            
            <div class="row justify-content-center">
                <div class="col-8">
                    <input type="text" id="user-input" class="form-control mb-3 text-center">
                    <button id="submit-btn" class="btn btn-primary w-100 fw-bold">Submit</button>
                    <h5 id="feedback" class="mt-3 fw-bold"></h5>
                </div>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
