<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">FourSight</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Game</a>
                <a class="nav-link" href="about_us.html">About Us</a>
                <a class="nav-link active" href="contact_us.html">Contact Us</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="game-box p-5 mx-auto text-start">
            <h2 class="mb-4">Contact Our Team</h2>
            
            <form>
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="3"></textarea>
                </div>
                <button type="button" class="btn btn-primary w-100 fw-bold">Send</button>
            </form>
        </div>
    </div>

</body>
</html>
